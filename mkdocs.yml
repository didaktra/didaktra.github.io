site_name: Didaktra
site_url: https://didaktra.com/
site_description: >-
  Instrukcije iz matematike i fizike za osnovnu i srednju školu,
  uživo u Rijeci ili online, na hrvatskom i talijanskom jeziku.
copyright: DIDAKTRA, obrt za poduke i edukaciju &copy; 2026.

theme:
  name: material
  language: hr
  # Jedna, svijetla paleta: bez prekidača za tamni način i bez skripte koja ga gasi
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Nunito
  icon:
    logo: material/school-outline
  favicon: images/school-outline.svg
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.tooltips

# Bez pretrage: za pet stranica nije potrebna (vratiti zajedno s blogom)
plugins: []
#  - search
#  - blog

nav:
  - Početna: index.md
  - Kako radimo: kako_radimo.md
  - Cjenik: cjenik.md
  - Online poduke: online.md
  - Kontakt: kontakt.md
  # - Blog:
  #   - blog/index.md

not_in_nav: |
  /hvala.md
  /placanje.md
  /linkovi.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/whatsapp
      link: https://wa.me/385976046485
      name: WhatsApp
    - icon: fontawesome/brands/viber
      link: viber://chat?number=+385976046485
      name: Viber
    - icon: fontawesome/brands/telegram
      link: https://t.me/didaktra
      name: Telegram        
    - icon: fontawesome/solid/envelope
      link: mailto:info@didaktra.com
      name: info@didaktra.com

extra_css:
  - stylesheets/extra.css
